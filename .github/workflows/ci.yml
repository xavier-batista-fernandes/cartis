name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, build and pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint and format (Biome)
        run: npx biome ci .

      - name: Build
        run: npm run build

      - name: Import the built entrypoint
        run: node --input-type=module -e "await import('./dist/index.js')"

      - name: Check package contents
        run: npm pack --dry-run
